<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>90% Full Is Almost Broken</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%8F%B3</text></svg>"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>90% Full Is Almost Broken</h1>

      <p class="intro">
        Drag the slider to change how busy the system is. Watch the queue and
        the estimated wait, especially as it gets close to full.
      </p>

      <section class="control">
        <div class="control-header">
          <label for="utilisation">Utilisation</label>
          <output for="utilisation" id="utilisation-value">50%</output>
        </div>
        <input type="range" id="utilisation" min="10" max="99" step="1" value="50" />
      </section>

      <section class="queue" aria-hidden="true">
        <p class="queue-label">Queue</p>
        <div class="queue-row" id="queue-row"></div>
        <p class="queue-overflow" id="queue-overflow" hidden></p>
      </section>

      <section class="result" aria-live="polite">
        <p class="result-line">
          <span class="result-label">Estimated wait</span>
          <strong id="wait-value" class="result-value">1.0 minutes</strong>
        </p>
        <p class="result-sub">
          <span id="queue-value">1</span> <span id="queue-noun">person</span> ahead of you
        </p>
      </section>

      <section class="chart">
        <svg
          id="chart"
          viewBox="0 0 300 160"
          role="img"
          aria-label="Chart of estimated wait time against utilisation, rising sharply as utilisation nears 99 percent"
        >
          <path id="chart-path" class="chart-path" />
          <circle id="chart-marker" class="chart-marker" r="5" />
        </svg>
      </section>

      <p class="takeaway">
        <strong>A system doesn't need to be full to feel overloaded.</strong>
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
